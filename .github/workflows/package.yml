name: Package ARM64 module

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    paths:
      - 'manifest/**'
      - 'scripts/**'
      - 'module/**'
      - 'Makefile'
      - '.github/workflows/package.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Host prerequisites
        run: sudo apt-get update && sudo apt-get install -y file binutils zip
      - name: Verify source-only repository
        run: make check
      - name: Resolve and qualify current ARM64 prebuilts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make update
      - name: Package exact resolved lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-static-tools-module
          path: |
            dist/*.zip
            dist/*.sha256
            build/provenance.json
            build/update-report.md
            build/update-report.json
            manifest/lock.json
