name: Package ARM64 module

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
  push:
    branches:
      - master
    paths:
      - 'manifest/**'
      - 'scripts/**'
      - 'module/**'
      - 'Makefile'
      - 'tests/**'
      - 'updates/**'
      - 'docs/**'
      - '.github/workflows/package.yml'

# Feature-branch pushes are already qualified by pull_request. Avoid running
# the same full packaging job twice for a single PR HEAD; keep default-branch
# checks after merging and manual/scheduled qualification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pull requests are checked at their exact head, not the synthetic merge ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Host prerequisites
        run: sudo apt-get update && sudo apt-get install -y file binutils zip zstd
      - name: Verify committed source
        run: make check
      - name: Fetch and qualify exact committed ARM64 lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make fetch
      - name: Package exact committed ARM64 lock and static Python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-static-tools-module
          path: |
            dist/*.zip
            dist/*.sha256
            build/provenance.json
            manifest/lock.json
          if-no-files-found: error

  update-report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Host prerequisites
        run: sudo apt-get update && sudo apt-get install -y file binutils zip zstd
      - name: Check upstream prebuilt updates without publishing changed lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make update
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-update-review
          path: |
            build/update-report.md
            build/update-report.json
            manifest/lock.json
          if-no-files-found: error
